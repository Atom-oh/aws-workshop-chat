# Local dev loop, no AWS account required for chat/threads/upvotes/export/moderation via the
# participant passphrase login. Two exceptions need real AWS credentials on the host: AI chat
# (Bedrock has no local emulator) and operator login (Cognito-backed, see auth.ts) — pass
# ADMIN_USERNAME/ADMIN_PASSWORD matching a real Cognito user in your dev/test pool for that path.
services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory"]
    ports: ["8000:8000"]

  table-init:
    image: amazon/aws-cli:latest
    depends_on: [dynamodb-local]
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - "until aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1; do sleep 1; done; aws dynamodb create-table --endpoint-url http://dynamodb-local:8000 --table-name WorkshopChat --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE --billing-mode PAY_PER_REQUEST || true"

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    depends_on:
      table-init:
        condition: service_completed_successfully
    ports: ["3000:3000"]
    environment:
      TABLE_NAME: WorkshopChat
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
      GUIDE_LOCAL_DIR: /guide
      SCALE: small
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin@ws}
      PARTICIPANT_PASSPHRASE: dev-passphrase
      PARTICIPANT_COUNT: "10"
      SESSION_SECRET: dev-secret-do-not-use-in-production
      # BEDROCK_MODEL_ID and real AWS credentials must come from the host environment
      # (docker compose --env-file or exported vars) to exercise the AI chat path.
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-}
    volumes:
      - ./guide:/guide:ro
